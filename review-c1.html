<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cコース 復習クイズ</title>
    <link rel="icon" href="./svg/favicon.svg?v=20260506-2" type="image/svg+xml" sizes="any" />
    <link rel="shortcut icon" href="./svg/favicon.svg?v=20260506-2" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <h1 class="brand-name">
            <img class="brand-logo" src="./svg/logo_white.svg" alt="BeEngineer" />
          </h1>
        </div>
        <p class="tagline">Cコース 1学期（第1〜12回）の復習クイズです。</p>
      </header>

      <section class="panel setup" id="setupPanel">
        <p class="hint" id="catalogHint">データを読み込み中です…</p>

        <div class="field-block review-course-block">
          <span class="inline-label">コース</span>
          <select id="reviewCourseFixed" class="select" disabled>
            <option>プロエンジニアコース</option>
          </select>
        </div>

        <h2 class="panel-title review-count-title">問題数を選ぶ</h2>
        <div class="review-count-group" id="reviewCountGroup" role="group" aria-label="問題数を選ぶ">
          <button type="button" class="review-count-btn" data-count="10" data-min="5" aria-pressed="false">
            <span class="review-count-num">10問</span>
            <span class="review-count-time">5分</span>
          </button>
          <button type="button" class="review-count-btn" data-count="20" data-min="7" aria-pressed="false">
            <span class="review-count-num">20問</span>
            <span class="review-count-time">7分</span>
          </button>
          <button type="button" class="review-count-btn" data-count="30" data-min="10" aria-pressed="false">
            <span class="review-count-num">30問</span>
            <span class="review-count-time">10分</span>
          </button>
        </div>
        <p class="review-note" id="reviewNote">
          問題数を選んで「確認テストモード」を押してください。第1〜12回からランダムに出題されます。
        </p>

        <div class="mode-buttons" id="modeButtons">
          <button type="button" class="btn btn-primary" id="btnTest" disabled>確認テストモード</button>
        </div>

        <!-- app.js が参照する要素。復習では使わないが、存在が必要なので非表示で保持する。 -->
        <div class="review-hidden-els" hidden aria-hidden="true">
          <select id="courseSelect" disabled><option value="">—</option></select>
          <div class="unit-select-combo" id="unitSelectCombo">
            <button
              type="button"
              id="unitSelectTrigger"
              disabled
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="unitSelectPanel"
            >
              —
            </button>
            <div class="unit-select-panel" id="unitSelectPanel" role="listbox" hidden></div>
            <select id="unitSelect" tabindex="-1" aria-hidden="true" disabled><option value="">—</option></select>
          </div>
          <button type="button" id="btnLoadUnit"></button>
          <button type="button" id="btnHomework"></button>
          <button type="button" id="btnAdmin"></button>
          <p id="unitTitleDisplay"></p>
        </div>
      </section>

      <main class="main" id="mainArea" hidden>
        <div class="toolbar">
          <button type="button" class="btn btn-ghost" id="btnBack">← 単元選択に戻る</button>
          <span class="toolbar-badge" id="modeBadge"></span>
        </div>

        <section class="panel homework-panel" id="homeworkPanel" hidden>
          <h2 class="panel-title" id="homeworkHeading">宿題モード</h2>
          <div class="study-progress" id="homeworkProgress" aria-live="polite"></div>
          <div class="test-card" id="homeworkCard">
            <p class="question-text" id="homeworkQuestion"></p>
            <div class="options cols-2" id="homeworkOptions"></div>
            <div id="homeworkCommentaryWrap" hidden></div>
            <button type="button" class="btn btn-primary homework-next-btn" id="homeworkNext" hidden>
              次の問題へ
            </button>
          </div>
          <div class="completion-banner" id="homeworkComplete" hidden role="status">
            <strong class="completion-title">宿題、おつかれさま！</strong>
            <p class="homework-result-line" id="homeworkScoreSummary"></p>
            <p class="completion-sub" id="homeworkCompleteCheer"></p>
          </div>
        </section>

        <section class="panel admin-panel" id="adminPanel" hidden>
          <h2 class="panel-title" id="adminHeading">管理者確認モード</h2>
          <div class="study-progress admin-summary" id="adminSummary" aria-live="polite"></div>
          <div class="admin-toolbar">
            <button type="button" class="btn btn-secondary admin-nav-btn" id="adminPrev">← 前の問題</button>
            <label class="admin-question-picker" for="adminQuestionSelect">
              <span class="inline-label">確認する問題</span>
              <select class="select admin-select" id="adminQuestionSelect"></select>
            </label>
            <button type="button" class="btn btn-secondary admin-nav-btn" id="adminNext">次の問題 →</button>
          </div>
          <div class="test-card admin-card" id="adminCard">
            <div class="admin-meta" id="adminMeta"></div>
            <div class="question-text" id="adminQuestion"></div>
            <div class="options cols-2 admin-options" id="adminOptions"></div>
            <div class="commentary" id="adminCommentary"></div>
          </div>
        </section>

        <section class="panel test-panel" id="testPanel" hidden>
          <h2 class="panel-title">確認テスト</h2>
          <p class="test-unit-line" id="testUnitLine"></p>
          <p class="hint test-intro" id="testIntro"></p>
          <div class="test-progress-sticky-wrap" id="testProgressWrap">
            <div class="study-progress study-progress--test-pending" id="testProgress" aria-live="polite"></div>
          </div>
          <div class="test-form-wrap" id="testFormWrap">
            <div class="test-all-questions" id="testList"></div>
            <button type="button" class="btn btn-primary test-submit-btn" id="btnSubmitTest">提出する</button>
          </div>
          <div class="test-result" id="testResult" hidden>
            <div class="test-result-summary">
              <p class="test-result-unit" id="testResultUnit"></p>
              <p class="test-time-notice" id="testTimeNotice" hidden></p>
              <p class="score-line" id="scoreLine"></p>
              <p class="pass-line" id="passLine"></p>
            </div>
            <div class="test-result-detail" id="testResultDetail"></div>
            <button type="button" class="btn btn-primary" id="btnRetryTest">もう一度テスト</button>
          </div>
        </section>
      </main>

      <div class="confirm-overlay" id="testBackConfirm" hidden>
        <div class="confirm-dialog panel" role="dialog" aria-modal="true" aria-labelledby="testBackConfirmTitle">
          <h2 class="panel-title" id="testBackConfirmTitle">確認</h2>
          <p class="confirm-message">確認テストを中断して、単元選択に戻りますか？</p>
          <div class="confirm-actions">
            <button type="button" class="btn btn-primary" id="confirmBackYes">はい</button>
            <button type="button" class="btn btn-secondary" id="confirmBackNo">いいえ</button>
          </div>
        </div>
      </div>

      <footer class="footer">
        <small>Cコース 1学期の復習用ページです。</small>
      </footer>
    </div>

    <!-- 復習ページ: Cコースの第1〜12回だけを表示する。app.js より前に置くこと -->
    <script>
      window.QUIZ_COURSES = ["C"];
      window.QUIZ_MAX_UNIT = 12;
    </script>
    <script src="app.js" defer></script>
    <!-- 復習ページ専用: 12単元をプールし、問題数セレクタを制御する（app.js の後に置くこと） -->
    <script src="review-c1.js" defer></script>
  </body>
</html>
